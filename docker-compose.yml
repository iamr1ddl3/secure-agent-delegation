# P1 runs unchanged, pinned at its v1.0.1 tag, as a separate service. Its bank credentials stay in p1.env
# (a copy of P1's .env, gitignored), which only the p1-mcp container reads. P2 code never sees them.
services:
  p1-mcp:
    build: https://github.com/iamr1ddl3/secure-sql-agent.git#v1.0.1
    env_file: p1.env
    command: ["python", "-m", "secure_sql_agent.mcp_server", "--http"]  # image sets MCP_HOST=0.0.0.0 (P1 v1.0.1)
    ports: ["127.0.0.1:8001:8000"]

  state-db:  # P2's own Postgres: policy store + checkpoints (decision D4). No bank data.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: p2
      POSTGRES_PASSWORD: p2-local
      POSTGRES_DB: p2
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["state-db:/var/lib/postgresql/data"]

volumes:
  state-db:
