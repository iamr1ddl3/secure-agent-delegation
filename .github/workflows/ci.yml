name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Contract tests (vendored P1 v1.0.0 schema)
        run: pytest -q
