[project]
name = "secure-agent-delegation"
version = "0.0.1"
description = "Supervisor agent that delegates to the Secure SQL Agent over MCP; the user's access survives delegation."
requires-python = ">=3.11"
dependencies = []  # ponytail: runtime deps land with the code that imports them (stage 1)

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.23", "pyyaml>=6", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_agent_delegation"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
